name: Workflow Artifact Demo

on:
    push:
        branches:
            - main
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Run ESLint
              run: npm run lint

    test:
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test

    build:
        runs-on: ubuntu-latest
        needs: test
        outputs:
            script-filename: ${{ steps.publish-js-filename.outputs.script-filename }}
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
            - name: Publish JS filename
              id: publish-js-filename
              run: find dist/assets/*.js -type f -execdir echo 'script-filename={}' >> $GITHUB_OUTPUT ';'
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  path: ./dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-artifact
                  path: ./dist
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            - name: Output contents
              run: ls
            - name: Output filename
              run: echo  "${{ needs.build.outputs.script-filename }}"
            - name: Deploy to Server
              run: echo "Deploying to server..."
